<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe5f3 50%, #ffd4eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Chat Panel */
        .chat-panel {
            height: 500px;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 20px;
            background: linear-gradient(135deg, #e0b3ff 0%, #d4a5ff 100%);
            color: white;
            text-align: center;
            border-bottom: 3px solid #c78dff;
        }

        .chat-header h2 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .chat-header .subtitle {
            font-size: 0.9em;
            opacity: 0.95;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #fff5fc 0%, #ffe9f7 100%);
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #ff9dce 0%, #ffa8d5 100%);
            margin-left: auto;
            color: white;
            border: 2px solid #ff85c0;
            text-align: right;
        }

        .message.bot {
            background: linear-gradient(135deg, #e0b3ff 0%, #d4a5ff 100%);
            margin-right: auto;
            color: white;
            border: 2px solid #c78dff;
        }

        .message.error {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff5582 100%);
            color: white;
            border: 2px solid #ff4477;
        }

        /* Input area */
        .input-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 3px solid #ff9dce;
            display: flex;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #ff9dce;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        .input-box:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }

        .send-btn {
            background: linear-gradient(135deg, #ff9dce 0%, #ffa8d5 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
            border: 2px solid #ff85c0;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, #ff85c0 0%, #ff9dce 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #ffe9f7;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff9dce;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff69b4;
        }

        /* Graph Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            max-height: 80%;
            overflow: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff9dce;
        }

        .modal-header h3 {
            color: #c78dff;
            margin: 0;
        }

        .close-btn {
            background: #ff9dce;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            background: #ff69b4;
        }

        .graph-area {
            position: relative;
            width: 100%;
            height: 300px;
            background: #fff5fc;
            border-radius: 10px;
            border: 2px solid #ffe9f7;
        }

        .node {
            position: absolute;
            background: linear-gradient(135deg, #e0b3ff 0%, #d4a5ff 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            border: 2px solid #c78dff;
            text-align: center;
            min-width: 60px;
        }

        .node:hover {
            background: linear-gradient(135deg, #d4a5ff 0%, #c78dff 100%);
            transform: scale(1.1);
        }

        .node-info {
            display: none;
            position: absolute;
            background: white;
            border: 2px solid #ff9dce;
            border-radius: 10px;
            padding: 10px;
            z-index: 100;
            min-width: 150px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .node-info h4 {
            margin: 0 0 8px 0;
            color: #c78dff;
            border-bottom: 1px solid #ffe9f7;
            padding-bottom: 5px;
        }

        .node-info p {
            margin: 3px 0;
            font-size: 0.9em;
            color: #666;
        }

        .edge-label {
            position: absolute;
            background: #fff4e6;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.7em;
            color: #ff9800;
            border: 1px solid #ffcc80;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- Chat Panel -->
    <div class="chat-panel">
        <div class="chat-header">
            <h2>KGraph Chatbot</h2>
            <div class="subtitle">See your family bubble</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                Hi! Do you have something to share with me?
            </div>
        </div>

        <div class="input-container">
            <input type="text" class="input-box" id="messageInput"
                   placeholder="Type your message here..."
                   onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="showGraphModal()" title="Show Family Graph" style="padding: 15px 15px;">🌳</button>
            <button class="send-btn" onclick="clearMemory()" title="Clear Memory" style="padding: 15px 15px; background: #ff6b6b;">🗑️</button>
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Graph Modal -->
    <div class="modal" id="graphModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Family Bubble</h3>
                <button class="close-btn" onclick="closeGraphModal()">Close</button>
            </div>
            <div class="graph-area" id="graphArea">
                <svg id="graphSvg" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>
            </div>
            <div class="node-info" id="nodeInfo">
                <h4 id="nodeInfoName">Name</h4>
                <div id="nodeInfoAttrs"></div>
            </div>
        </div>
    </div>

    <script>
        // Track if memory is ready
        var memoryReady = false;

        // Clear memory on page load - force no cache
        window.addEventListener('load', async function() {
            memoryReady = false;
            document.getElementById('messageInput').disabled = true;
            document.getElementById('messageInput').placeholder = 'Clearing memory...';

            try {
                const response = await fetch('/clear?t=' + Date.now(), {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    console.log('Memory cleared on page load');
                    memoryReady = true;
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('messageInput').placeholder = 'Type your message here...';
                } else {
                    console.error('Clear failed:', response.status);
                    addMessage('Failed to clear memory. Please refresh.', 'error');
                }
            } catch (error) {
                console.error('Failed to clear memory on load:', error);
                addMessage('Failed to clear memory. Please refresh.', 'error');
            }
        });

        // Manual clear memory function
        async function clearMemory() {
            memoryReady = false;
            document.getElementById('messageInput').disabled = true;

            try {
                const response = await fetch('/clear?t=' + Date.now(), {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    // clear chat display too
                    var chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '<div class="message bot">Memory cleared! Let\'s start fresh.</div>';
                    memoryReady = true;
                    document.getElementById('messageInput').disabled = false;
                    console.log('Memory cleared manually');
                } else {
                    addMessage('Failed to clear memory', 'error');
                    memoryReady = true;
                    document.getElementById('messageInput').disabled = false;
                }
            } catch (error) {
                console.error('Clear error:', error);
                addMessage('Failed to clear memory', 'error');
                memoryReady = true;
                document.getElementById('messageInput').disabled = false;
            }
        }

        // ===================================================================
        // Chatbot Functions
        // ===================================================================

        function addMessage(text, type) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            // don't send if memory not ready
            if (!memoryReady) {
                console.log('Memory not ready yet');
                return;
            }

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            const chatContainer = document.getElementById('chatContainer');
            let botMessageDiv = null;

            try {
                // Use fetch for streaming with Server-Sent Events
                const response = await fetch('/chat-stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const eventData = JSON.parse(line.slice(6));

                            if (eventData.type === 'token') {
                                if (!botMessageDiv) {
                                    botMessageDiv = document.createElement('div');
                                    botMessageDiv.className = 'message bot';
                                    botMessageDiv.textContent = '';
                                    chatContainer.appendChild(botMessageDiv);
                                }
                                fullResponse += eventData.content;
                                botMessageDiv.textContent = fullResponse;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } else if (eventData.type === 'rejected') {
                                if (botMessageDiv) {
                                    botMessageDiv.remove();
                                }
                                addRejectionMessage(eventData.content);
                            } else if (eventData.type === 'error') {
                                if (botMessageDiv) {
                                    botMessageDiv.remove();
                                }
                                addMessage(eventData.content, 'error');
                            } else if (eventData.type === 'done') {
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }
                    }
                }
            } catch (error) {
                if (botMessageDiv) {
                    botMessageDiv.remove();
                }
                addMessage('Connection error! Please check your internet and try again.', 'error');
            }
        }

        function addRejectionMessage(message) {
            const chatContainer = document.getElementById('chatContainer');

            const rejectionDiv = document.createElement('div');
            rejectionDiv.className = 'message bot';
            rejectionDiv.style.background = 'linear-gradient(135deg, #fff4e6 0%, #ffe8cc 100%)';
            rejectionDiv.style.border = '2px solid #ff9800';
            rejectionDiv.style.color = '#333';

            // converting markdown bold and newlines to HTML
            rejectionDiv.innerHTML = message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

            chatContainer.appendChild(rejectionDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // ===================================================================
        // Graph Modal Functions
        // ===================================================================

        var graphData = null;
        var nodePositions = {};

        async function showGraphModal() {
            // fetch graph data - no cache
            try {
                const response = await fetch('/graph-data?t=' + Date.now(), {
                    cache: 'no-store'
                });
                console.log('Response status:', response.status);

                if (!response.ok) {
                    addMessage('Server error: ' + response.status, 'error');
                    return;
                }

                const result = await response.json();
                console.log('Graph data:', result);

                if (result.error) {
                    addMessage(result.message, 'error');
                    return;
                }

                graphData = result.data;
                document.getElementById('graphModal').style.display = 'block';
                drawGraph();
            } catch (error) {
                console.error('Graph error:', error);
                addMessage('Failed to load graph: ' + error.message, 'error');
            }
        }

        function closeGraphModal() {
            document.getElementById('graphModal').style.display = 'none';
            document.getElementById('nodeInfo').style.display = 'none';
        }

        function drawGraph() {
            var area = document.getElementById('graphArea');
            if (!area) {
                console.error('graphArea not found');
                return;
            }

            // clear old content
            area.innerHTML = '<svg id="graphSvg" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>';
            var svg = document.getElementById('graphSvg');

            // check if graphData exists and has nodes
            if (!graphData || !graphData.nodes || graphData.nodes.length == 0) {
                area.innerHTML = '<div class="no-data">No family members to display yet. <br>Let us start to chat and add people.</div>';
                return;
            }

            var width = area.offsetWidth;
            var height = area.offsetHeight;

            // position nodes in a circle
            var centerX = width / 2;
            var centerY = height / 2;
            var radius = Math.min(width, height) / 3;

            nodePositions = {};
            for (var i = 0; i < graphData.nodes.length; i++) {
                var node = graphData.nodes[i];
                var angle = (2 * Math.PI * i) / graphData.nodes.length;
                var x = centerX + radius * Math.cos(angle) - 40;
                var y = centerY + radius * Math.sin(angle) - 20;
                nodePositions[node.id] = {x: x + 40, y: y + 20};

                // create node div
                var nodeDiv = document.createElement('div');
                nodeDiv.className = 'node';
                nodeDiv.textContent = node.name;
                nodeDiv.style.left = x + 'px';
                nodeDiv.style.top = y + 'px';
                nodeDiv.onclick = (function(n) {
                    return function(e) { showNodeInfo(n, e); };
                })(node);

                area.appendChild(nodeDiv);
            }

            // draw edges
            var seenEdges = {};
            for (var i = 0; i < graphData.edges.length; i++) {
                var edge = graphData.edges[i];
                var key = edge.from + '-' + edge.to;
                var reverseKey = edge.to + '-' + edge.from;

                // skip if already drew reverse
                if (seenEdges[reverseKey]) continue;
                seenEdges[key] = true;

                var from = nodePositions[edge.from];
                var to = nodePositions[edge.to];

                if (from && to) {
                    // draw line
                    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', from.x);
                    line.setAttribute('y1', from.y);
                    line.setAttribute('x2', to.x);
                    line.setAttribute('y2', to.y);
                    line.setAttribute('stroke', '#ffcc80');
                    line.setAttribute('stroke-width', '2');
                    svg.appendChild(line);

                    // add label
                    var labelDiv = document.createElement('div');
                    labelDiv.className = 'edge-label';
                    labelDiv.textContent = edge.relation;
                    labelDiv.style.left = ((from.x + to.x) / 2 - 20) + 'px';
                    labelDiv.style.top = ((from.y + to.y) / 2 - 10) + 'px';
                    area.appendChild(labelDiv);
                }
            }
        }

        function showNodeInfo(node, event) {
            var info = document.getElementById('nodeInfo');
            var nameEl = document.getElementById('nodeInfoName');
            var attrsEl = document.getElementById('nodeInfoAttrs');

            nameEl.textContent = node.name;

            // show attributes
            var html = '';
            var keys = Object.keys(node.attributes);
            if (keys.length == 0) {
                html = '<p>No attributes yet</p>';
            } else {
                for (var i = 0; i < keys.length; i++) {
                    var key = keys[i];
                    html = html + '<p><b>' + key + ':</b> ' + node.attributes[key] + '</p>';
                }
            }
            attrsEl.innerHTML = html;

            // position near click
            var modal = document.querySelector('.modal-content');
            var rect = modal.getBoundingClientRect();
            info.style.left = (event.clientX - rect.left + 10) + 'px';
            info.style.top = (event.clientY - rect.top + 10) + 'px';
            info.style.display = 'block';
        }

        // close info popup when clicking elsewhere
        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('node') && e.target.id != 'nodeInfo') {
                var info = document.getElementById('nodeInfo');
                if (info && !info.contains(e.target)) {
                    info.style.display = 'none';
                }
            }
        });

        // close modal when clicking outside
        document.getElementById('graphModal').addEventListener('click', function(e) {
            if (e.target.id == 'graphModal') {
                closeGraphModal();
            }
        });
    </script>
</body>
</html>
